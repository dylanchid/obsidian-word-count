name: Check plugin
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Validate manifest
        run: node -e "const m=require('./manifest.json'); if (!m.id || !m.name || !/^\d+\.\d+\.\d+$/.test(m.version)) process.exit(1)"
